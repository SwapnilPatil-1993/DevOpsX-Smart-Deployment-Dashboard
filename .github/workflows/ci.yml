name: DevOpsX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Report CI result to DevOpsX dashboard
        if: always() && github.event_name == 'push'
        env:
          MONITOR_TOKEN: ${{ secrets.DEVOPSX_MONITOR_TOKEN }}
          CI_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$MONITOR_TOKEN" ]; then
            echo "DEVOPSX_MONITOR_TOKEN is not configured; skipping dashboard status report."
            exit 0
          fi
          if [ "$CI_RESULT" = "success" ]; then STATUS="Success"; else STATUS="Failed"; fi
          curl --fail-with-body --silent --show-error --max-time 15 \
            -X POST "https://devopsx-smart-deployment-dashboard.onrender.com/api/ci-status" \
            -H "Authorization: Bearer $MONITOR_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"status\":\"$STATUS\",\"run_url\":\"$RUN_URL\",\"commit_sha\":\"$COMMIT_SHA\"}"
